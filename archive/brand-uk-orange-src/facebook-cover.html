<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 851px;
    height: 315px;
    background: #0a0f0d;
    position: relative;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  /* orange glow behind the mark, off-center like the site's stadium-light amber accent */
  .glow {
    position: absolute;
    top: 50%;
    left: 34%;
    width: 520px;
    height: 520px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,122,26,0.30), transparent 62%);
  }
  /* faint goal-net texture, same diagonal cross pattern as the live site */
  .net {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(45deg, rgba(255,150,90,0.08) 1px, transparent 1px),
      linear-gradient(-45deg, rgba(255,150,90,0.08) 1px, transparent 1px);
    background-size: 34px 34px;
  }
  /* safe zone: centered ~640px wide block survives Facebook's mobile crop */
  .safe {
    position: relative;
    width: 640px;
    height: 315px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .brandRow { display: flex; align-items: center; gap: 14px; }
  .word { font-family: Arial, sans-serif; font-weight: 800; font-size: 56px; letter-spacing: -1px; }
  .word .m { color: #eaf3ee; }
  .word .k { color: #ff7a1a; }
  .tagline {
    margin-top: 10px;
    font-family: 'Courier New', monospace;
    font-size: 17px;
    letter-spacing: 0.3px;
    color: #a99b90;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="net"></div>
  <div class="safe">
    <div class="brandRow">
      <svg viewBox="0 0 132 116" width="72" height="64" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M66 5 L122 20 V56 C122 86 98 103 66 111 C34 103 10 86 10 56 V20 Z" stroke="#ff7a1a" stroke-width="5" />
        <g stroke="#ff7a1a" stroke-width="1.5" opacity="0.45">
          <line x1="30" y1="30" x2="30" y2="64" /><line x1="39" y1="30" x2="39" y2="64" />
          <line x1="48" y1="30" x2="48" y2="64" /><line x1="57" y1="30" x2="57" y2="64" />
          <line x1="66" y1="30" x2="66" y2="64" /><line x1="75" y1="30" x2="75" y2="64" />
          <line x1="84" y1="30" x2="84" y2="64" /><line x1="93" y1="30" x2="93" y2="64" />
          <line x1="102" y1="30" x2="102" y2="64" />
          <line x1="30" y1="30" x2="102" y2="30" /><line x1="30" y1="38" x2="102" y2="38" />
          <line x1="30" y1="47" x2="102" y2="47" /><line x1="30" y1="56" x2="102" y2="56" />
          <line x1="30" y1="64" x2="102" y2="64" />
        </g>
        <path d="M30 64 V30 H102 V64" stroke="#ff7a1a" stroke-width="3" opacity="0.85" />
        <path d="M40 70 L56 88 L98 44" stroke="#ffa64d" stroke-width="9" />
      </svg>
      <div class="word"><span class="m">Match</span><span class="k">Keeper</span></div>
    </div>
    <div class="tagline">Every match deserves a real keeper</div>
  </div>
</body>
</html>
