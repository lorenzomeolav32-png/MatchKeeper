<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 320px;
    height: 320px;
    background: #0a0f0d;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 340px;
    height: 340px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,122,26,0.32), transparent 65%);
  }
  .center {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <!-- icon sized to stay well inside Facebook's circular crop -->
  <div class="center">
    <svg viewBox="0 0 132 116" width="192" height="169" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M66 5 L122 20 V56 C122 86 98 103 66 111 C34 103 10 86 10 56 V20 Z" stroke="#ff7a1a" stroke-width="6" />
      <g stroke="#ff7a1a" stroke-width="2" opacity="0.45">
        <line x1="30" y1="30" x2="30" y2="64" /><line x1="39" y1="30" x2="39" y2="64" />
        <line x1="48" y1="30" x2="48" y2="64" /><line x1="57" y1="30" x2="57" y2="64" />
        <line x1="66" y1="30" x2="66" y2="64" /><line x1="75" y1="30" x2="75" y2="64" />
        <line x1="84" y1="30" x2="84" y2="64" /><line x1="93" y1="30" x2="93" y2="64" />
        <line x1="102" y1="30" x2="102" y2="64" />
        <line x1="30" y1="30" x2="102" y2="30" /><line x1="30" y1="38" x2="102" y2="38" />
        <line x1="30" y1="47" x2="102" y2="47" /><line x1="30" y1="56" x2="102" y2="56" />
        <line x1="30" y1="64" x2="102" y2="64" />
      </g>
      <path d="M30 64 V30 H102 V64" stroke="#ff7a1a" stroke-width="4" opacity="0.85" />
      <path d="M40 70 L56 88 L98 44" stroke="#ffa64d" stroke-width="11" />
    </svg>
  </div>
</body>
</html>
